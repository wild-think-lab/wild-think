 href="/wild-think/writing/">文章</a><a href="/wild-think/tags/">标签</a><a href="/wild-think/archive/">归档</a><a href="/wild-think/about/">关于</a> <a href="/wild-think/search/">搜索</a> </nav> </header> <main id="main">  <div class="container narrow" style="max-width:860px"> <div class="page-head"> <div class="kicker">SEARCH / <span id="total-hint">— </span></div> <h1>搜索</h1> <p>标题、描述、标签与正文关键词都会参与匹配。按 <kbd>/</kbd> 可随时回到这里。</p> </div> <div class="search-box"> <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>  <input id="q" type="search" placeholder="例如：OSPF、慢查询、journald、Pod 排障…" autocomplete="off" autofocus> </div> <p class="search-hint" id="hint">输入关键词开始检索</p> <div id="results"></div> </div> <script>(function(){const indexUrl = "/wild-think/search-index.json";

    const input = document.getElementById('q');
    const results = document.getElementById('results');
    const hint = document.getElementById('hint');
    const totalHint = document.getElementById('total-hint');
    let data = [];
    let loaded = false;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function mark(text, q) {
      const safe = esc(text);
      if (!q) return safe;
      const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      return safe.replace(re, '<span style="color:var(--accent)">$1</span>');
    }

    function render(q) {
      if (!loaded) return;
      const key = q.trim().toLowerCase();
      if (!key) {
        results.innerHTML = '';
        hint.textContent = '输入关键词开始检索 · 共 ' + data.length + ' 篇可搜索';
        return;
      }
      const hits = data.filter((d) => {
        const hay = (d.title + ' ' + d.desc + ' ' + d.tags.join(' ') + ' ' + d.text).toLowerCase();
        return hay.includes(key);
      });
      hint.textContent = '匹配 ' + hits.length + ' 篇 · 关键词「' + q.trim() + '」';
      if (!hits.length) {
        results.innerHTML = '<div class="empty">// 没有找到相关内容，换个关键词试试</div>';
        return;
      }
      results.innerHTML = hits
        .map((d) => {
          const excerpt = d.text.length > 140 ? d.text.slice(0, 140) + '…' : d.text;
          return (
            '<a class="search-result" href="' + d.url + '">' +
              '<h3>' + mark(d.title, key) + '</h3>' +
              '<p>' + mark(excerpt, key) + '</p>' +
              '<div class="sr-meta">' + esc(d.topic) + ' · ' + d.date +
                (d.tags.length ? ' · ' + d.tags.map((t) => '#' + t).join(' ') : '') +
              '</div>' +
            '</a>'
          );
        })
        .join('');
    }

    const params = new URLSearchParams(location.search);
    if (params.get('q')) input.value = params.get('q');

    fetch(indexUrl)
      .then((r) => r.json())
      .then((json) => {
        data = json;
        loaded = true;
        totalHint.textContent = data.length + ' NOTES';
        render(input.value);
      })
      .catch(() => {
        hint.textContent = '搜索索引加载失败，请刷新重试';
      });

    let timer;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      const v = input.value;
      timer = setTimeout(() => render(v), 180);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        history.replaceState(null, '', '?q=' + encodeURIComponent(e.target.value.trim()));
      }
    });
  })();</script>  </main> <footer class="site-footer"> <div class="container"> <div class="footer-grid"> <div class="footer-brand"> <a class="brand" href="/wild-think/"> <span class="brand-mark">野</span> <span>野生思考</span> </a> <p>把复杂的技术，变成可以落地复现的思考与实践</p> </div> <div class="footer-col"> <h4>专题</h4> <a href="/wild-think/topics/linux/">Linux 运维知识库</a><a href="/wild-think/topics/network/">计算机网络与路由交换</a><a href="/wild-think/topics/security/">网络安全与渗透基础</a><a href="/wild-think/topics/sre-cloud/">云原生与 SRE 体系</a><a href="/wild-think/topics/db/">数据库知识库</a> </div> <div class="footer-col"> <h4>站点</h4> <a href="/wild-think/writing/">全部文章</a> <a href="/wild-think/archive/">归档</a> <a href="/wild-think/tags/">标签</a> <a href="/wild-think/about/">关于本站</a> <a href="/wild-think/rss.xml">RSS 订阅</a> </div> </div> <div class="footer-bottom"> <span>© 2026–2026 野生思考 · wild-think-lab</span> <span class="sig">// 把复杂的技术，写成可以走的路</span> </div> </div> </footer> <button class="to-top" id="to-top" aria-label="回到顶部"> <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class aria-hidden="true"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>  </button> <script type="module">const o=document.documentElement,c=document.getElementById("theme-toggle");c?.addEventListener("click",()=>{o.classList.toggle("light");try{localStorage.setItem("theme",o.classList.contains("light")?"light":"dark")}catch{}});const i=document.getElementById("menu-toggle"),d=document.getElementById("mobile-nav");i?.addEventListener("click",()=>{d?.classList.toggle("open")});const n=document.getElementById("to-top"),l=()=>{n?.classList.toggle("show",window.scrollY>700)};window.addEventListener("scroll",l,{passive:!0});l();n?.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));document.addEventListener("keydown",t=>{const e=t.target,s=e&&/^(INPUT|TEXTAREA)$/.test(e.tagName);t.key==="/"&&!s&&(t.preventDefault(),locat
